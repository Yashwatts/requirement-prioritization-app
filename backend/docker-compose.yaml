services:
  postgres:
    image: postgres:16
    container_name: requirement-prioritization-app-postgres-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: requirement_prioritization_app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d requirement_prioritization_app',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      requirement-prioritization-app-network:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4
    container_name: requirement-prioritization-app-pgadmin-container
    restart: always
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - requirement-prioritization-app-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: requirement-prioritization-app-rabbitmq
    restart: always
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      requirement-prioritization-app-network:
        aliases:
          - rabbitmq

  requirement-prioritization-app-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: requirement-prioritization-app-backend
    restart: always
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - requirement-prioritization-app-network

volumes:
  postgres_data: {}
  pgadmin_data: {}
  rabbitmq_data: {}

networks:
  requirement-prioritization-app-network:
    external: true
